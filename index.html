    <script src="characters.js"></script>

    <script>
        const pcImages = ["bgimg/PC_1.png", "bgimg/PC_2.png", "bgimg/PC_3.png"];
        const spImages = ["bgimg/D_1.png", "bgimg/D_2.png", "bgimg/D_3.png"];
        let currentIndex = 0;
        const backImg = document.getElementById('slideshow-image-back');
        const frontImg = document.getElementById('slideshow-image-front');

        function updateSlideshow() {
            const isMobile = window.innerWidth <= 600;
            const currentArray = isMobile ? spImages : pcImages;
            const nextIndex = (currentIndex + 1) % currentArray.length;
            backImg.src = currentArray[nextIndex];
            frontImg.style.opacity = 0;
            setTimeout(() => {
                frontImg.src = currentArray[nextIndex];
                frontImg.style.transition = 'none';
                frontImg.style.opacity = 1;
                setTimeout(() => {
                    frontImg.style.transition = 'opacity 1.5s ease-in-out';
                }, 50);
                currentIndex = nextIndex;
            }, 1500);
        }

        function initSlideshow() {
            const isMobile = window.innerWidth <= 600;
            const currentArray = isMobile ? spImages : pcImages;
            if (frontImg) frontImg.src = currentArray[0];
            if (backImg) backImg.src = currentArray[1 % currentArray.length];
        }
        initSlideshow();
        setInterval(updateSlideshow, 7000);

        fetch('news.json').then(res => res.json()).then(data => {
            const container = document.getElementById('news-container');
            data.slice(0, 1).forEach(item => {
                const a = document.createElement('a');
                a.className = 'news-container';
                a.innerHTML = `${item.date} <span class="category">${item.category}</span> ${item.title}`;
                a.href = item.url;
                container.appendChild(a);
            });
        }).catch(e => console.log("News error"));

        const GRID_SIZE = 20;
        const OFFSET_X = 60;
        fetch('timeline.json').then(res => res.json()).then(data => {
            const area = document.getElementById('timeline-area');
        });
    </script>

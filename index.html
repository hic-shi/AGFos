<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGFos! - HOME</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a href="index.html" id="title">
        <h1>AGFos!</h1>
    </a>

    <nav class="nav-column">
        <a href="index.html">●</a>
        <a href="Lore.html">●</a>
        <a href="news.html">●</a>
    </nav>

    <div class="main-container">
        <div class="content-column">
            <div id="Top">
                <div class="white-box" id="white-box1">
                    <h3>news</h3>
                    <div id="news-container"></div>
                    <a class="more" id="morenews" href="news.html">more→</a>
                </div>
                <div id="slideshow-container">
                    <img id="slideshow-image-back" class="slideshow-image" src="" alt="">
                    <img id="slideshow-image-front" class="slideshow-image" src="" alt="">
                </div>
            </div>

            <div class="white-box character-box-margin">
                <h3 style="margin-top: 0px;">アージー・クリストフの手記とは？</h3>
                <p>1960〜90年代の近代的な街並みに魔法が息づく世界で、家族を惨殺したメロウへの復讐を誓う少年：アージーが、メロウの足取りを知るという青年：フォスと共に、手がかりを求めて各地を彷徨う。</p>
                <p style="text-wrap: balance;"><a href="https://x.com/search?q=%23%E3%82%A2%E3%83%BC%E3%82%B8%E3%83%BC%E3%83%BB%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%88%E3%83%95%E3%81%AE%E6%89%8B%E8%A8%98&src=recent_search_click&f=live">#アージー・クリストフの手記</a> <a href="https://x.com/search?q=%23AG%E6%89%8B%E8%A8%98&src=typed_query">#AG手記</a> </p>
            </div>

            <div class="slider-wrapper" id="sliderWrapper">
                <button class="slider-nav-btn prev" id="prevBtn" aria-label="Previous">
                    <span class="slider-arrow"></span>
                </button>

                <div class="click-layer">
                    <div class="click-area prev" id="clickPrev"></div>
                    <div class="click-area center"></div>
                    <div class="click-area next" id="clickNext"></div>
                </div>

                <div class="character-slider" id="slider"></div>

                <button class="slider-nav-btn next" id="nextBtn" aria-label="Next">
                    <span class="slider-arrow"></span>
                </button>
            </div>

            <div class="timeline-flex-container">
                <div class="white-box timeline-box">
                    <h3>Timeline</h3>
                    <div class="timeline-wrapper" id="timeline-area">
                        <div class="timeline-line"></div>
                        <div class="scale-mark" style="top: -10px;">1</div>
                        <div class="scale-mark" style="top: 112px;">2</div>
                        <div class="scale-mark" style="top: 212px;">3</div>
                    </div>
                </div>

                <div id="extra-info">
                    <div class="white-box info-content">
                        <h3 id="info-title" class="info-title-style"></h3>
                        <div id="info-links" class="info-links-style"></div>
                        <div class="info-body">
                            <div class="info-thumbnail" id="info-thumbnail"></div>
                            <div class="info-text-side">
                                <div id="info-description" class="info-description-style"></div>
                                <div id="info-meta" class="info-meta-style"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="by"><a href="https://hic-shi.github.io/HOME/index.html">©HIC_SHI</a></div>
        </div>
    </div>

    <script src="characters.js"></script>

    <script>
        // スライドショー
        const pcImages = ["bgimg/PC_1.png", "bgimg/PC_2.png", "bgimg/PC_3.png"];
        const spImages = ["bgimg/D_1.png", "bgimg/D_2.png", "bgimg/D_3.png"];
        let currentIndex = 0;
        const backImg = document.getElementById('slideshow-image-back');
        const frontImg = document.getElementById('slideshow-image-front');

        function updateSlideshow() {
            const isMobile = window.innerWidth <= 600;
            const currentArray = isMobile ? spImages : pcImages;
            const nextIndex = (currentIndex + 1) % currentArray.length;
            if (backImg) backImg.src = currentArray[nextIndex];
            if (frontImg) {
                frontImg.style.opacity = 0;
                setTimeout(() => {
                    frontImg.src = currentArray[nextIndex];
                    frontImg.style.transition = 'none';
                    frontImg.style.opacity = 1;
                    setTimeout(() => {
                        frontImg.style.transition = 'opacity 1.5s ease-in-out';
                    }, 50);
                    currentIndex = nextIndex;
                }, 1500);
            }
        }

        function initSlideshow() {
            const isMobile = window.innerWidth <= 600;
            const currentArray = isMobile ? spImages : pcImages;
            if (frontImg) frontImg.src = currentArray[0];
            if (backImg) backImg.src = currentArray[1 % currentArray.length];
        }
        initSlideshow();
        setInterval(updateSlideshow, 7000);

        // ニュース
        fetch('news.json').then(res => res.json()).then(data => {
            const container = document.getElementById('news-container');
            if (container && Array.isArray(data)) {
                data.slice(0, 1).forEach(item => {
                    const a = document.createElement('a');
                    a.className = 'news-container';
                    a.innerHTML = `${item.date} <span class="category">${item.category}</span> ${item.title}`;
                    a.href = item.url;
                    container.appendChild(a);
                });
            }
        }).catch(e => console.log("News error:", e));

        // タイムライン
        const GRID_SIZE = 20;
        const OFFSET_X = 60;
        fetch('timeline.json').then(res => res.json()).then(data => {
            const area = document.getElementById('timeline-area');
            if (!area || !Array.isArray(data)) return;

            data.forEach(work => {
                if (work.y_start !== undefined && work.y_end !== undefined) {
                    const startPos = work.y_start * GRID_SIZE;
                    const endPos = work.y_end * GRID_SIZE;
                    
                    const range = document.createElement('div');
                    range.className = 'timeline-range';
                    range.style.top = `${startPos}px`;
                    range.style.height = `${endPos - startPos}px`;
                    range.style.left = `${OFFSET_X + work.x}px`;
                    range.onclick = () => showDetail(work);
                    area.appendChild(range);

                    [startPos, endPos].forEach(pos => {
                        const dot = document.createElement('div');
                        dot.className = 'dot-btn';
                        dot.style.top = `${pos}px`;
                        dot.style.left = `${OFFSET_X + work.x}px`;
                        dot.style.pointerEvents = 'none';
                        area.appendChild(dot);
                    });
                } else if (work.y !== undefined) {
                    const btn = document.createElement('div');
                    btn.className = 'dot-btn';
                    btn.style.top = `${work.y * GRID_SIZE}px`;
                    btn.style.left = `${OFFSET_X + work.x}px`;
                    btn.onclick = () => showDetail(work);
                    area.appendChild(btn);
                }
            });
        }).catch(e => console.log("Timeline error:", e));

        // タイムライン詳細表示関数
        function showDetail(work) {
            const titleEl = document.getElementById('info-title');
            const metaEl = document.getElementById('info-meta');
            const descEl = document.getElementById('info-description');
            const thumbEl = document.getElementById('info-thumbnail');
            const linkList = document.getElementById('info-links');

            if (titleEl) titleEl.textContent = work.title || "";
            if (metaEl) metaEl.textContent = `${work.date || ''} / ${work.time_id || ''} [${work.category || ''}]`;
            if (descEl) descEl.textContent = work.description || "説明はありません。";

            if (thumbEl) {
                thumbEl.innerHTML = '';
                if (work.image) {
                    const img = document.createElement('img');
                    img.src = work.image;
                    thumbEl.appendChild(img);
                } else {
                    thumbEl.textContent = "画像なし";
                }
            }

            if (linkList) {
                linkList.innerHTML = '';
                if (work.links) {
                    for (const [key, url] of Object.entries(work.links)) {
                        const a = document.createElement('a');
                        a.href = url;
                        a.style.cssText = "display:inline-block; color:#fff; background:#ffbe14; margin-right:10px; padding:2px 10px; border-radius:15px; font-size:11px; font-weight:bold;";
                        a.textContent = key.toUpperCase();
                        linkList.appendChild(a);
                    }
                }
            }
        }
    </script>
</body>

</html>
